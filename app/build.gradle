plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.localcash'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "com.localcash"
        minSdk 28
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Room: exportar schema SQLite para documentación técnica
        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    buildTypes {
        release {
            optimization {
                enable false
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        viewBinding true
    }
    testOptions {
        unitTests {
            // Robolectric (tech-stack.md §4): requiere recursos/manifest fusionados
            includeAndroidResources = true
            all {
                // JDK 17+: java.base no exporta jdk.internal.access; Robolectric lo
                // necesita para interceptar FileDescriptor (ApplicationSharedMemory).
                jvmArgs '--add-exports=java.base/jdk.internal.access=ALL-UNNAMED'
            }
        }
    }
}

dependencies {
    implementation libs.activity.ktx
    implementation libs.appcompat
    implementation libs.biometric
    implementation libs.constraintlayout
    implementation libs.material
    // Biometría: AndroidX Biometric para BiometricPrompt (API 23+)
    implementation "androidx.biometric:biometric:1.2.0-alpha05"
    // Seguridad: EncryptedSharedPreferences para almacenamiento cifrado de credenciales
    implementation "androidx.security:security-crypto:1.1.0-alpha06"
    // Room: Base de datos SQLite local para datos financieros
    implementation "androidx.room:room-runtime:2.6.1"
    annotationProcessor "androidx.room:room-compiler:2.6.1"
    testImplementation "androidx.room:room-testing:2.6.1"
    testImplementation libs.junit
    // Robolectric: tests de DAO en JVM local sin dispositivo (tech-stack.md §4/§7)
    testImplementation "org.robolectric:robolectric:4.17"
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit
}